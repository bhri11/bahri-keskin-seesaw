<html>
<head>
    <title>Seesaw Project - Bahri Keskin</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="container">
        <div id="stats">
            <div class="stat-boxes">
                <div class="stat-labels">Left Weight</div>
                <div class="stat-values" id="left-weight-value">0.0 kg</div>

            </div>
            <div class="stat-boxes">
                <div class="stat-labels">Next Weight</div>
                <div class="stat-values" id="next-weight-value">0 kg</div>


            </div>
            <div class="stat-boxes">
                <div class="stat-labels">Right Weight</div>
                <div class="stat-values" id="right-weight-value">0.0 kg</div>
                


            </div>
            <div class="stat-boxes">
                <div class="stat-labels">Tilt Angle</div>
                <div class="stat-values" id="tilt-angle-value">0.0°</div>

                
            </div>

        </div>

        <div id="playground">
            <div id="seesaw-group">
                <div id="seesaw"></div>
                
            </div>
            <div id="pivot"></div>

            <div id="weight-preview">
                <div id="weight-preview-circle">1kg</div>
                <div id="weight-preview-line"></div>
            </div>
        </div>

        <div id="controls">
            <button id="reset-button">Reset</button>
        </div>

        

        

    </div>
    <script src="script.js"></script>
</body>

</html>
